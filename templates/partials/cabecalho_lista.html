{# Título + busca + botão "novo" das listagens. Parâmetros: titulo, url_novo #}
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
  <h1 class="h3 m-0">{{ titulo }}</h1>
  <div class="d-flex gap-2">
    <form method="get" class="d-flex" role="search">
      <input class="form-control" type="search" name="q" value="{{ q }}" placeholder="Buscar..." aria-label="Buscar">
    </form>
    {% if url_novo %}<a href="{{ url_novo }}" class="btn btn-vistore text-nowrap"><i class="bi bi-plus-lg"></i> Novo</a>{% endif %}
  </div>
</div>
