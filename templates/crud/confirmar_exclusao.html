{% extends "base.html" %}
{% block titulo %}Excluir{% endblock %}
{% block conteudo %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card shadow-sm border-danger">
      <div class="card-body p-4">
        <h1 class="h4"><i class="bi bi-exclamation-triangle text-danger"></i> Confirmar exclusão</h1>
        <p>Tem certeza que deseja excluir <strong>{{ object }}</strong>? Esta ação não pode ser desfeita.</p>
        <form method="post" class="d-flex gap-2">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">Excluir</button>
          <a href="{{ view.success_url }}" class="btn btn-outline-secondary">Cancelar</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
