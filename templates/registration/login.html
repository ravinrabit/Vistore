{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="row justify-content-center mt-md-5">
  <div class="col-sm-10 col-md-6 col-lg-4">
    <div class="text-center mb-4">
      <i class="bi bi-shield-check display-4 text-vistore"></i>
      <h1 class="h3 fw-bold mt-2">Vistore</h1>
      <p class="text-body-secondary">Manutenção predial com segurança do trabalho</p>
    </div>
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <form method="post" novalidate>
          {% csrf_token %}
          {% if form.non_field_errors %}
            <div class="alert alert-danger">{{ form.non_field_errors|join:" " }}</div>
          {% endif %}
          <div class="mb-3">
            <label for="{{ form.username.id_for_label }}" class="form-label">{{ form.username.label }}</label>
            {{ form.username }}
          </div>
          <div class="mb-3">
            <label for="{{ form.password.id_for_label }}" class="form-label">{{ form.password.label }}</label>
            {{ form.password }}
          </div>
          <input type="hidden" name="next" value="{{ next }}">
          <button type="submit" class="btn btn-vistore w-100">Entrar</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
